# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# R8 runs inside this process, and on this app it is the heaviest thing that
# ever does: ~209 MB of input classes producing a 179 MB mapping file. At 3g it
# spent most of a 14-minute run in GC rather than in the optimiser. 6g is sized
# against the same 16 GB budget as before -- one daemon doing real work, an
# idle second one, and the two Kotlin daemons below -- which is why it is not
# larger. The idle timeout underneath is what keeps that arithmetic honest.
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Give the Kotlin compiler daemon its own sized heap instead of inheriting Gradle's.
# Sized so IDE-spawned and CLI-spawned daemon pairs can coexist in 16 GB.
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
# Default is three hours, which on a 16 GB machine means the daemon from
# whichever of the IDE and the CLI you used this morning is still holding its
# heap this afternoon while the other one tries to run R8. Thirty minutes.
org.gradle.daemon.idletimeout=1800000
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Reuse task outputs from previous builds.
org.gradle.caching=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# The app's version, in one place. Both :app (which sets the real manifest
# version) and :core:config (whose BuildConfig is what DebugLog stamps on crash
# reports) read these. They used to be written out separately in each build
# file, which drifted silently: every crash report claimed "1.0 (1)" no matter
# what shipped, which is exactly the field you need to be true.
wmkb.versionCode=11
wmkb.versionName=0.5.1
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
