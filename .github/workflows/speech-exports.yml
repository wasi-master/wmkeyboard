name: Speech model exports

# Converts open speech models the app's engines cannot read as they are
# published (tools/speech-exports/README.md says which, and how). Run by
# hand. Every model is one job; its files and manifest (sizes, SHA-256, a
# test transcript) come out as an artifact, and with `hf_owner` set and an
# HF_TOKEN secret they are also pushed to <hf_owner>/<name>-sherpa-onnx,
# which EtModels.kt then pins by revision.
on:
  workflow_dispatch:
    inputs:
      family:
        description: addis (Addis AI's Nemotron fine-tunes, for Offline Sherpa) or waxal (Omnilingual 300M fine-tunes, for Offline Omnilingual)
        type: choice
        options: [addis, waxal]
        default: addis
      only:
        description: Comma-separated subset (addis tigrinya,oromo,swahili; waxal tir,amh,orm,...); empty = all
        default: ''
      hf_owner:
        description: Hugging Face user or org to push to (empty = artifact only)
        default: ''

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.plan.outputs.models }}
    steps:
      - id: plan
        env:
          FAMILY: ${{ inputs.family }}
          ONLY: ${{ inputs.only }}
        shell: python3 {0}
        run: |
          import json, os
          # name, source, MMS-TTS voice and a sentence for the smoke test.
          addis = [
              {"name": "tigrinya", "repo": "addisai/addis-scribe-tigrinya-streaming", "prompt": 49,
               "iso3": "tir", "text": "ሰላም ከመይ ኣለኻ"},
              {"name": "oromo", "repo": "addisai/addis-scribe-oromo-streaming", "prompt": 59,
               "iso3": "orm", "text": "akkam jirta"},
              {"name": "swahili", "repo": "addisai/addis-scribe-swahili-streaming", "prompt": 48,
               "iso3": "swh", "text": "habari yako mimi ni mzima"},
          ]
          # The WAXAL languages the keyboard has a layout for; Acholi, Ikposo,
          # Maasai, Nyankole, Sidamo, Lusoga and Wolaytta have none yet.
          waxal = [{"name": c, "iso3": c, "text": t} for c, t in [
              ("tir", "ሰላም ከመይ ኣለኻ"), ("amh", "ሰላም እንዴት ነህ"), ("orm", "akkam jirta"),
              ("lug", ""), ("aka", ""), ("dag", ""), ("dga", ""), ("ewe", ""), ("ful", ""),
              ("lin", ""), ("mlg", ""), ("sna", ""),
          ]]
          models = addis if os.environ["FAMILY"] == "addis" else waxal
          only = {s.strip() for s in os.environ["ONLY"].split(",") if s.strip()}
          if only:
              models = [m for m in models if m["name"] in only]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"models={json.dumps(models)}\n")

  export:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    env:
      # The sherpa-onnx release the app's bridge is built from
      # (native/sherpa-onnx-jni/build.sh): its exporter writes what that
      # runtime reads.
      SHERPA_COMMIT: af2d8d81dbfa61c4cea4c568da78f3982edca005
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /

      # A 0.6B model in fp32 twice over, plus ONNX export's peak.
      - name: Swap
        run: |
          sudo swapoff -a || true
          dir=/mnt; [ -d "$dir" ] || dir=/
          sudo fallocate -l 12G "$dir/wmkb.swap"
          sudo chmod 600 "$dir/wmkb.swap"
          sudo mkswap "$dir/wmkb.swap" > /dev/null
          sudo swapon "$dir/wmkb.swap"
          free -h

      # NeMo's main branch wants 3.12 or newer, omnilingual-asr 3.12 at most.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # fairseq2 and NeMo both read audio through libsndfile.
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libsndfile1 ffmpeg

      - name: Python environment
        run: |
          python -m venv /opt/x
          . /opt/x/bin/activate
          pip install -q --upgrade pip
          if [ "${{ inputs.family }}" = addis ]; then
            pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            # Nemotron 3.5's prompted model is only in NeMo's main branch so
            # far, as sherpa-onnx's own export workflow notes.
            pip install -q Cython packaging
            pip install -q "nemo_toolkit[asr] @ git+https://github.com/NVIDIA/NeMo.git@main"
            pip install -q onnx onnxruntime ipython sentencepiece kaldi-native-fbank soundfile librosa
            pip install -q huggingface_hub sherpa-onnx transformers
          else
            # fairseq2 0.6 is built against torch 2.8 and pins huggingface_hub
            # to 0.3x, which also holds transformers below 5.
            pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
            pip install -q "omnilingual-asr==0.2.0" onnx onnxruntime "huggingface_hub~=0.32" "transformers<5" sherpa-onnx
          fi
          pip freeze | grep -iE '^(torch|nemo|omnilingual|fairseq2|onnx|onnxruntime|sherpa)' | tee versions.txt

      - name: Export
        env:
          NAME: ${{ matrix.model.name }}
        run: |
          . /opt/x/bin/activate
          if [ "${{ inputs.family }}" = addis ]; then
            curl -fsSL "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$SHERPA_COMMIT/scripts/nemo/nemotron-3.5-asr-streaming-0.6b/export_onnx.py" \
              -o /tmp/export_nemotron.py
            python tools/speech-exports/export_addis.py --repo "${{ matrix.model.repo }}" \
              --prompt "${{ matrix.model.prompt }}" --sherpa-script /tmp/export_nemotron.py --out "out/$NAME"
          else
            python tools/speech-exports/export_waxal.py --lang "$NAME" --out "out/$NAME"
          fi
          cp versions.txt "out/$NAME/"
          ls -la "out/$NAME"

      - name: Smoke test
        if: matrix.model.text != ''
        run: |
          . /opt/x/bin/activate
          python tools/speech-exports/smoke.py --dir "out/${{ matrix.model.name }}" \
            --kind "${{ inputs.family == 'addis' && 'nemotron' || 'omnilingual' }}" \
            --iso3 "${{ matrix.model.iso3 }}" --text "${{ matrix.model.text }}"

      - name: Summary
        run: |
          { echo '```json'; cat "out/${{ matrix.model.name }}/manifest.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.family }}-${{ matrix.model.name }}-sherpa-onnx
          path: out/${{ matrix.model.name }}
          compression-level: 0

      - name: Push to Hugging Face
        if: inputs.hf_owner != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OWNER: ${{ inputs.hf_owner }}
          NAME: ${{ matrix.model.name }}
          FAMILY: ${{ inputs.family }}
        run: |
          . /opt/x/bin/activate
          python - <<'EOF'
          import json, os
          from huggingface_hub import HfApi
          name, family = os.environ["NAME"], os.environ["FAMILY"]
          source = json.load(open(f"out/{name}/manifest.json"))["source"]
          repo = f"{os.environ['OWNER']}/{source.split('/')[-1]}-sherpa-onnx"
          api = HfApi()
          api.create_repo(repo, repo_type="model", exist_ok=True)
          commit = api.upload_folder(repo_id=repo, folder_path=f"out/{name}", commit_message=f"{source} for sherpa-onnx")
          print("revision", commit.oid)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"\nPushed to https://huggingface.co/{repo} at revision `{commit.oid}`\n")
          EOF
