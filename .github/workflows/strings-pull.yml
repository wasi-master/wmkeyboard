# Throwaway: the 0.6.5 strings-pull bundle. Lives only on branch
# strings-pull-0.6.5, never on main. Builds the Play AAB exactly as
# release.yml's bundle job does, at wmkb.versionCode 100040 (Play 1000400, a
# code no real release will reach), and uploads it to the internal track as a
# DRAFT: Play translates its strings on upload, nothing rolls out. The upload
# retries every 3 minutes for up to five and a half hours, since Play's
# translation step and this upload's connection can both fail for hours.
name: Strings pull 0.6.5
on:
  push:
    branches: [strings-pull-0.6.5]
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
      - name: Build AAB
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -Dorg.gradle.daemon=false
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          WMKB_ENABLE_PLAY_STORE: 'true'
          WMKB_ENABLE_GMS: 'true'
          WMKB_KEYMAN_LAYOUT_PACK: 'true'
          WMKB_KLIPY_API_KEY: ${{ secrets.WMKB_KLIPY_API_KEY }}
          WMKB_GIPHY_API_KEY: ${{ secrets.WMKB_GIPHY_API_KEY }}
          WMKB_BRAVE_API_KEY: ${{ secrets.WMKB_BRAVE_API_KEY }}
          WMKB_TRANSLATE_API_KEY: ${{ secrets.WMKB_TRANSLATE_API_KEY }}
          WMKB_UNSPLASH_API_KEY: ${{ secrets.WMKB_UNSPLASH_API_KEY }}
          WMKB_PEXELS_API_KEY: ${{ secrets.WMKB_PEXELS_API_KEY }}
          WMKB_DROPBOX_APP_KEY: ${{ secrets.WMKB_DROPBOX_APP_KEY }}
          WMKB_ONEDRIVE_CLIENT_ID: ${{ secrets.WMKB_ONEDRIVE_CLIENT_ID }}
          WMKB_BOX_CLIENT_ID: ${{ secrets.WMKB_BOX_CLIENT_ID }}
          WMKB_BOX_CLIENT_SECRET: ${{ secrets.WMKB_BOX_CLIENT_SECRET }}
          WMKB_SMARTTHINGS_CLIENT_ID: ${{ secrets.WMKB_SMARTTHINGS_CLIENT_ID }}
          WMKB_SMARTTHINGS_CLIENT_SECRET: ${{ secrets.WMKB_SMARTTHINGS_CLIENT_SECRET }}
        run: ./gradlew bundleEnRelease --stacktrace
      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: strings-pull-bundle
          path: app/build/outputs/bundle/enRelease/*.aab
          retention-days: 7
  upload:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: strings-pull-bundle
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Upload to internal as a draft
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-key.json
          aab=$(ls dist/*.aab | head -n1)
          ls -l "$aab"
          for attempt in $(seq 1 40); do
            echo "attempt $attempt started at $(date -u +%H:%M)"
            if bundle exec fastlane run upload_to_play_store json_key:play-key.json \
              package_name:com.wasimaster.wmkeyboard track:internal release_status:draft \
              "aab:$PWD/$aab" skip_upload_apk:true skip_upload_metadata:true \
              skip_upload_changelogs:true skip_upload_images:true skip_upload_screenshots:true \
              timeout:3600; then
              echo "uploaded on attempt $attempt at $(date -u +%H:%M)"; exit 0
            fi
            echo "upload attempt $attempt failed at $(date -u +%H:%M)"; sleep 180
          done
          exit 1
      - name: Wipe key
        if: always()
        run: rm -f play-key.json
