name: Build custom translation APK
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble sideload APK
        run: ./gradlew :app:assembleIntlDebug -Pwmkb.skipBenchmarks=true --stacktrace
      - name: Upload custom debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wmkeyboard-translation-trigger-apk
          path: app/build/outputs/apk/intl/debug/*.apk
          if-no-files-found: error
          retention-days: 7
