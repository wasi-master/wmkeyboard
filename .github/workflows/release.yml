name: Release

# Tag a commit `v0.3.0` and push it. The tag must match wmkb.versionName in
# gradle.properties or the first job stops the run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but do not publish a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      buildable: ${{ steps.v.outputs.buildable }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          declared=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          # Tags older than this pipeline keep the version in
          # app/build.gradle.kts and cannot be built by it. They were tagged
          # after the fact so their notes have somewhere to live, so stand the
          # run down rather than failing it; their releases are made by hand.
          if [ -z "$declared" ]; then
            echo "::notice::${{ github.ref_name }} has no wmkb.versionName and predates this workflow. Nothing to build."
            {
              echo "version="
              echo "buildable=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "buildable=true" >> "$GITHUB_OUTPUT"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = 'tag' ]; then
            tag='${{ github.ref_name }}'
            if [ "v$declared" != "$tag" ]; then
              echo "::error::Tag $tag does not match wmkb.versionName=$declared"
              exit 1
            fi
          fi
          echo "Releasing $declared"

  apks:
    name: Signed APKs (direct download)
    needs: verify
    if: needs.verify.outputs.buildable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # The signing block resolves RELEASE_STORE_FILE against the repo root, so
      # the keystore is written there and never leaves the runner.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::warning::KEYSTORE_BASE64 is not set. Generating fallback debug release keystore."
            keytool -genkeypair -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # splitApks=true gives one APK per ABI instead of one fat universal APK,
      # which is what the download page wants. Play channel off: this build must
      # not carry the in-app-update library, since it only works via Play.
      - name: Build release APKs
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'androiddebugkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
          WMKB_ENABLE_PLAY_STORE: 'false'
          WMKB_ENABLE_GMS: 'true'
          WMKB_SPLIT_APKS: 'true'
          WMKB_KLIPY_API_KEY: ${{ secrets.WMKB_KLIPY_API_KEY }}
          WMKB_GIPHY_API_KEY: ${{ secrets.WMKB_GIPHY_API_KEY }}
          WMKB_BRAVE_API_KEY: ${{ secrets.WMKB_BRAVE_API_KEY }}
          WMKB_TRANSLATE_API_KEY: ${{ secrets.WMKB_TRANSLATE_API_KEY }}
          WMKB_UNSPLASH_API_KEY: ${{ secrets.WMKB_UNSPLASH_API_KEY }}
          WMKB_PEXELS_API_KEY: ${{ secrets.WMKB_PEXELS_API_KEY }}
          WMKB_DROPBOX_APP_KEY: ${{ secrets.WMKB_DROPBOX_APP_KEY }}
          WMKB_ONEDRIVE_CLIENT_ID: ${{ secrets.WMKB_ONEDRIVE_CLIENT_ID }}
        # All four flavour combinations compile at once and share one Kotlin
        # daemon, whose 2 GB heap (gradle.properties) is sized for a 16 GB
        # laptop next to an IDE. The runner has nothing else on it, so give the
        # daemon room.
        #
        # The `languages` flavour changes only which res/values-xx are packaged,
        # but Gradle still gives each variant its own Kotlin compilation, so
        # this is roughly twice the work the two-flavour build was. It ran in
        # about 12 minutes; the timeout above has the room.
        run: |
          ./gradlew \
            assembleFullIntlRelease assembleFullEnRelease \
            assembleLiteIntlRelease assembleLiteEnRelease \
            -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace

      # Versioned filenames (wmkeyboard-0.3.0-vc7-full-arm64-v8a.apk) so APKs
      # from different releases can sit in the same Downloads folder without
      # the browser calling them duplicates. vc = versionCode, which moves even
      # when the name does not (a re-cut of the same versionName).
      - name: Collect artifacts
        run: |
          version=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          find app/build/outputs/apk -name '*-release.apk' | while read -r apk; do
            name=$(basename "$apk" .apk)   # app-full-arm64-v8a-release
            name=${name#app-}
            name=${name%-release}
            cp "$apk" "dist/wmkeyboard-${version}-vc${code}-${name}.apk"
          done
          # R8 mappings, one per variant (ABI splits share one). Taken from this
          # job's build, not the bundle job's: the Play flags change what R8
          # renames, so the AAB's map does not retrace these APKs. The AAB
          # carries its own map in BUNDLE-METADATA, which Play reads by itself.
          #
          # Four now rather than two. The two language builds are separate R8
          # runs, so their maps are not interchangeable even though the Kotlin
          # that went in was identical.
          for capability in full lite; do
            for language in Intl En; do
              lower=$(echo "$language" | tr '[:upper:]' '[:lower:]')
              map="app/build/outputs/mapping/${capability}${language}Release/mapping.txt"
              if [ ! -f "$map" ]; then
                echo "::error::No R8 mapping at $map"
                exit 1
              fi
              gzip -9c "$map" \
                > "dist/wmkeyboard-${version}-vc${code}-${capability}-${lower}-mapping.txt.gz"
            done
          done
          # Native symbols, full only: lite sets debugSymbolLevel NONE. Both
          # language builds carry the same .so files, but each variant writes
          # its own zip and the release grid links them separately.
          for language in Intl En; do
            lower=$(echo "$language" | tr '[:upper:]' '[:lower:]')
            syms="app/build/outputs/native-debug-symbols/full${language}Release/native-debug-symbols.zip"
            if [ -f "$syms" ]; then
              cp "$syms" "dist/wmkeyboard-${version}-vc${code}-full-${lower}-native-symbols.zip"
            else
              echo "::warning::No native debug symbols at $syms"
            fi
          done
          # nullglob: with no symbols zip, a literal `*.zip` would reach
          # sha256sum and fail the step under the runner's `bash -e`.
          shopt -s nullglob
          cd dist && sha256sum *.apk *.gz *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/
          retention-days: 30

  # The reference APK for F-Droid's reproducible build. F-Droid builds each tag
  # from source itself, compares its unsigned APK with this one, and if they
  # match apart from the signature it copies this signature onto its build and
  # publishes that, so F-Droid users get an APK signed with our key. The recipe
  # points at this file through `Binaries:` (fdroid/com.wasimaster.wmkeyboard.yml).
  #
  # It has to be the build F-Droid makes, byte for byte, so it copies the
  # recipe: the lite+intl variant through the `assembleLiteRelease` alias, run
  # from app/ as fdroidserver does, with the recipe's three flags and nothing
  # else. No API keys (the recipe passes none, and a key is a BuildConfig
  # string), no ABI split. Its own runner, so no flag from the `apks` job leaks
  # in through a shared Gradle daemon or configuration cache.
  #
  # Built without the recipe's prebuild seds. They delete lines the lite build
  # never resolves, so the output is the same with or without them; checked by
  # rebuilding 0.5.9 and comparing it with the APK F-Droid published.
  fdroid:
    name: F-Droid reference APK
    needs: verify
    if: needs.verify.outputs.buildable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # F-Droid's builder uses Debian's OpenJDK 21. The major version is what
      # matters: Kotlin, D8 and R8 ship with the build and do not depend on it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::warning::KEYSTORE_BASE64 is not set. Generating fallback debug release keystore."
            keytool -genkeypair -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build the F-Droid APK
        working-directory: app
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'androiddebugkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
        run: |
          ../gradlew \
            -Pwmkb.enablePlayStore=false \
            -Pwmkb.enableGms=false \
            -Pwmkb.enableFdroid=true \
            assembleLiteRelease --stacktrace

      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore

      # AllowedAPKSigningKeys in the recipe pins this certificate, and F-Droid
      # refuses a reference APK signed by anything else, or signed with v1
      # alone. Better to find out here than from a failed build on their side
      # a few days after the release.
      - name: Collect and check
        run: |
          version=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          shopt -s nullglob
          apks=(app/build/outputs/apk/lite/release/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected one APK in apk/lite/release, found ${#apks[@]}"
            exit 1
          fi
          mkdir -p dist
          out="dist/wmkeyboard-${version}-vc${code}-fdroid.apk"
          cp "${apks[0]}" "$out"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs -v "$out")
          echo "$certs"
          echo "$certs" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            || { echo "::error::$out has no v2 signature"; exit 1; }
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "$certs" | grep -q 'certificate SHA-256 digest: d6c1f30a6116d33e4e778b372f335faa91dad35f657a84e4e7077b29641e7cad' \
              || { echo "::error::$out is not signed with the key AllowedAPKSigningKeys pins"; exit 1; }
          else
            echo "::warning::Skipping AllowedAPKSigningKeys digest check because fallback debug keystore was used."
          fi
          # AGP writes the commit into the APK. F-Droid builds from a real
          # clone, so it records the hash; a checkout AGP cannot read (a git
          # worktree, a tarball) writes NO_VALID_GIT_FOUND instead, and that
          # one file is enough to fail the comparison.
          unzip -p "$out" META-INF/version-control-info.textproto | grep -q "revision: \"$GITHUB_SHA\"" \
            || { echo "::error::$out does not record commit $GITHUB_SHA"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: fdroid-apk
          path: dist/
          retention-days: 30

  bundle:
    name: Play bundle (artifact only)
    needs: verify
    if: needs.verify.outputs.buildable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # Play channel on: unbundled ML Kit, in-app updates, and :feature:llm,
      # :feature:translate, :feature:litert and :feature:handwriting as
      # on-demand modules. bundle<Variant> ignores the ABI split block.
      #
      # The `en` language build, by its real name. Play translates the app
      # strings itself and injects them into the bundle at upload, so the 48
      # translations in the repo, which were recovered from Play to begin with,
      # would only be handed back to it. `bundleFullRelease` still exists as an
      # alias in app/build.gradle.kts and builds the same thing, but it mirrors
      # the AAB to bundle/fullRelease/ as well, and this job has no use for a
      # second 60 MB copy.
      - name: Build AAB
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          WMKB_ENABLE_PLAY_STORE: 'true'
          WMKB_ENABLE_GMS: 'true'
          WMKB_KLIPY_API_KEY: ${{ secrets.WMKB_KLIPY_API_KEY }}
          WMKB_GIPHY_API_KEY: ${{ secrets.WMKB_GIPHY_API_KEY }}
          WMKB_BRAVE_API_KEY: ${{ secrets.WMKB_BRAVE_API_KEY }}
          WMKB_TRANSLATE_API_KEY: ${{ secrets.WMKB_TRANSLATE_API_KEY }}
          WMKB_UNSPLASH_API_KEY: ${{ secrets.WMKB_UNSPLASH_API_KEY }}
          WMKB_PEXELS_API_KEY: ${{ secrets.WMKB_PEXELS_API_KEY }}
          WMKB_DROPBOX_APP_KEY: ${{ secrets.WMKB_DROPBOX_APP_KEY }}
          WMKB_ONEDRIVE_CLIENT_ID: ${{ secrets.WMKB_ONEDRIVE_CLIENT_ID }}
        run: ./gradlew bundleFullEnRelease --stacktrace

      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore

      # The fifth mapping. This job builds with the Play channel flags on, and
      # those change what R8 renames, so none of the four mappings the `apks`
      # job publishes retraces a crash from a Play install — which is most of
      # the crashes anyone will ever paste into an issue. Play Console reads
      # the copy inside the bundle and needs no help; a reporter on GitHub has
      # no way to reach it, and neither has the retrace bot. So it goes to the
      # release like the others.
      #
      # `fullEnRelease` and not `fullRelease`: the AAB above is the `en` build
      # by its real name, and the mapping has to come from the same R8 run.
      - name: Collect the Play mapping
        run: |
          version=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          map=app/build/outputs/mapping/fullEnRelease/mapping.txt
          if [ ! -f "$map" ]; then
            echo "::error::No R8 mapping at $map"
            exit 1
          fi
          mkdir -p dist
          gzip -9c "$map" > "dist/wmkeyboard-${version}-vc${code}-play-mapping.txt.gz"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: play-mapping
          path: dist/*-play-mapping.txt.gz
          retention-days: 30

      # Not attached to the GitHub release: an AAB is not installable. The
      # play job below picks it up and uploads it to the internal track.
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: app/build/outputs/bundle/fullEnRelease/*.aab
          retention-days: 30

  # Uploads the AAB to the Play *internal* track via fastlane; promoting to
  # production stays a decision you make by hand (`bundle exec fastlane
  # android promote`, or the Console). Skips itself with a warning when the
  # service-account secret is absent, so tagging a release still works before
  # Play API access is configured.
  play:
    name: Upload to Play (internal track)
    needs: [verify, bundle]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: play-bundle
          path: dist

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Upload to internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload. Grab the play-bundle artifact and upload it by hand, or add the secret (see docs/development/releasing)."
            exit 0
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-key.json
          aab=$(ls dist/*.aab | head -n1)
          WMKB_PLAY_JSON_KEY=play-key.json bundle exec fastlane android internal "aab:$aab"

      - name: Wipe key
        if: always()
        run: rm -f play-key.json

  publish:
    name: Publish GitHub release
    # `bundle` as well as `apks`: the Play mapping is a release asset now, and
    # both jobs carry the same `buildable` gate, so nothing that used to
    # publish is held back by waiting for it. `fdroid` because F-Droid fetches
    # its reference APK from this release, and a release without it fails their
    # build of this version.
    needs: [verify, apks, bundle, fdroid]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      # Full history: the notes script finds the previous tag and walks the
      # commits between it and this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      # Built on the other runner with the Play flags on, so it arrives as its
      # own artifact rather than in release-apks.
      - uses: actions/download-artifact@v4
        with:
          name: play-mapping
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: fdroid-apk
          path: dist

      # SHA256SUMS.txt was written by the apks job, before these files existed.
      - name: Check-sum the Play mapping and the F-Droid APK
        run: |
          shopt -s nullglob
          cd dist
          for f in *-play-mapping.txt.gz *-fdroid.apk; do
            grep -q " $f$" SHA256SUMS.txt || sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      # The body is built from the artifacts that were actually produced, so
      # the download grid carries real file sizes and never links a file the
      # build did not make.
      - name: Build release notes
        id: notes
        run: |
          code=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          .github/scripts/release-notes.sh \
            '${{ needs.verify.outputs.version }}' \
            "$code" \
            '${{ github.ref_name }}' \
            dist \
            '${{ github.repository }}' > release-body.md
          echo "--- release body ---"
          cat release-body.md

      # Done with the gh CLI rather than softprops/action-gh-release, which
      # failed the 0.5.9 publish with "Error creating asset temp dir" and left
      # a draft carrying three of its twelve files. Uploading one file at a
      # time is slower and does not fall over.
      #
      # The release is made as a draft, filled, and only then published, so it
      # never appears to a watcher with half its APKs attached. The whole step
      # is idempotent: a re-run edits and re-uploads over whatever the last
      # attempt managed.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TITLE: WM Keyboard ${{ needs.verify.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*.apk dist/*-mapping.txt.gz dist/*-native-symbols.zip dist/SHA256SUMS.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nothing in dist/ to attach"
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --title "$TITLE" --notes-file release-body.md
          else
            gh release create "$TAG" --repo "$REPO" --draft \
              --title "$TITLE" --notes-file release-body.md
          fi
          for f in "${files[@]}"; do
            echo "uploading $(basename "$f")"
            gh release upload "$TAG" --repo "$REPO" --clobber "$f"
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest

  # Comments on every issue the release notes link, now that there is a
  # release to point at. A call rather than a `release: published` trigger in
  # that workflow, because the release above is published with this run's
  # token, and GitHub starts no workflow for an event that token caused.
  issue-comments:
    name: Tell the linked issues
    needs: [verify, publish]
    if: github.ref_type == 'tag' && !inputs.dry_run
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/release-comments.yml
    with:
      tag: ${{ github.ref_name }}

  # Points the bug report form at the version just published, so reporters
  # are asked to confirm they are on it. Runs after publish, so a failed or
  # dry run never advertises a version nobody can download. Commits to main,
  # not the tag: a tag can be cut from an older commit and the form must
  # follow main.
  issue-template:
    name: Bump bug report version
    needs: [verify, publish]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rewrite and push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          file=.github/ISSUE_TEMPLATE/bug_report.yml
          old=$(sed -n 's/^# latest-version: //p' "$file")
          if [ -z "$old" ]; then
            echo "::error::$file has no '# latest-version:' line"
            exit 1
          fi
          if [ "$old" = "$VERSION" ]; then
            echo "Bug report already names $VERSION"
            exit 0
          fi
          # Dots escaped so 0.5.9 does not also match 0x5y9.
          pattern=$(printf '%s' "$old" | sed 's/\./\\./g')
          sed -i "s/$pattern/$VERSION/g" "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m "chore(issues): bug report asks for $VERSION"
          # main may move while the release builds; rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Could not push the bug report bump to main"
          exit 1
