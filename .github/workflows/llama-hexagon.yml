name: llama.cpp Hexagon build

# Builds libwmllama_hexagon.so, llama.cpp with ggml's Hexagon backend for the
# Snapdragon NPU, and its DSP skels (libggml-htp-v73.so .. v85.so), and
# uploads them. The Hexagon SDK the skels need runs on x86-64 Linux only, so
# this runs in Qualcomm's own toolchain container, which carries it, the NDK
# and CMake. Run by hand after changing native/llamacpp-jni or its pins, then
# commit the artifact's files into core/intelligence/src/llamanpu/jniLibs/.
# Never part of F-Droid's build: the SDK is Qualcomm's.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Tools the container may lack
        run: |
          for tool in git ninja python3 curl; do
            command -v "$tool" > /dev/null || missing="$missing $tool"
          done
          if [ -n "${missing:-}" ]; then
            apt-get update -qq && apt-get install -y -qq git ninja-build python3 curl > /dev/null
          fi
          git config --global --add safe.directory '*'

      - name: Build
        env:
          # Only the Hexagon variant: the CPU, OpenCL and Vulkan ones are
          # built on a workstation with NDK r29 (README.md).
          WMKB_ABIS: arm64-v8a
          WMKB_LLAMA_CPU: '0'
          WMKB_LLAMA_GPU: '0'
          WMKB_LLAMA_VULKAN: '0'
        run: |
          export ANDROID_NDK=${ANDROID_NDK_ROOT:?the container names no NDK}
          echo "Hexagon SDK: ${HEXAGON_SDK_ROOT:?the container names no Hexagon SDK}"
          native/llamacpp-jni/build.sh

      # Play refuses a library in lib/arm64-v8a whose LOAD segments are not
      # 16 KB aligned, whatever processor it is for.
      - name: Segment alignment
        run: |
          readelf=$(ls "$ANDROID_NDK_ROOT"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          bad=0
          for f in core/intelligence/src/llamanpu/jniLibs/arm64-v8a/*.so; do
            aligns=$("$readelf" -lW "$f" | awk '$1 == "LOAD" { print $NF }' | sort -u | tr '\n' ' ')
            echo "$(basename "$f"): $aligns"
            for a in $aligns; do [ $((a)) -ge 16384 ] || bad=1; done
          done
          [ "$bad" = 0 ] || { echo "a library is aligned below 16 KB"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: wmllama-hexagon-jniLibs
          path: core/intelligence/src/llamanpu/jniLibs/arm64-v8a/*.so
