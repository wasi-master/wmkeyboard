# latest-version: 0.6.5
# The release workflow rewrites every occurrence of the version on the line
# above when it publishes a release. Keep that line first and the version
# spelt the same way everywhere below, or the bump misses it.
name: 🐛 Bug Report
description: File a bug report here
title: "[BUG]: "
labels: ["bug"]
assignees: ["wasi-master"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report 🤗
        Make sure there aren't any open/closed issues for this topic 😃

        > [!IMPORTANT]
        > The latest version is **0.6.5**. Many reported bugs are already fixed in it, so please update first and check the bug still happens.
        >
        > See your version in **Settings › About** ([open it directly](https://wmkeyboard.pages.dev/open/#wmkeyboard://setting/about_version_title)). Get the latest from the [releases page](https://github.com/wasi-master/wmkeyboard/releases/latest).

  - type: checkboxes
    id: latest-version
    attributes:
      label: Version check
      options:
        - label: I am on version 0.6.5 (the latest) and the bug still happens there
          required: true

  - type: input
    id: app-version
    attributes:
      label: Build (optional)
      description: Only if it is not the plain release, for example an F-Droid, Play or nightly build. The full name is in Settings › About
      placeholder: "0.6.5 from F-Droid"
    validations:
      required: false

  - type: textarea
    id: bug-description
    attributes:
      label: Description of the bug
      description: Give us a brief description of what happened and what should have happened
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: crash-log
    attributes:
      label: Crash log
      description: |
        If the keyboard crashed, disappeared mid-typing, or swapped itself out for another keyboard, paste its own record here — **Settings › About › Diagnostics › Share diagnostics** ([open it directly](https://wmkeyboard.pages.dev/open/#wmkeyboard://settings/debug_log)).

        **Keep the `version:` and `android:` lines at the top.** They are the part that makes the rest usable: a release build's stack trace reads `at q3.a(SourceFile:15)` and means nothing on its own, and those lines say which build to read it against — including whether it came from F-Droid, Google Play or the releases page here, which each need a different one. A trace pasted without them usually cannot be read at all.

        In the app, **Settings › About › Diagnostics** → hold the crash text copies it with those lines already in front. Nothing you type is ever in there.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: |
        Provide any additional information such as logs, screenshots, links, scenarios in which the bug occurs so that it facilitates resolving the issue.
