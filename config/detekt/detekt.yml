# detekt configuration for WM Keyboard.
#
# Layered on top of detekt's own defaults (`buildUponDefaultConfig = true`), so
# this file only records *deviations*. Every deviation carries the reason it
# exists — a rule turned off without a reason is a rule that gets turned off
# again next time it is inconvenient.
#
# Guiding principle: this project is an IME. Correctness bugs are invisible to
# the user until they eat a keystroke, so bug-finding rules are turned UP, while
# size/style metrics that fire constantly on legitimately large Compose files
# are turned DOWN rather than being papered over with @Suppress everywhere.
#
# Run:
#   ./gradlew detektFullDebug          # with type resolution (finds the most)
#   ./gradlew detekt                   # source-only, fast
#   ./gradlew staticAnalysis           # everything, including Android Lint

build:
  # Zero tolerance for anything that carries weight. What *carries* weight is
  # decided below: correctness rules count, size metrics do not.
  maxIssues: 0
  excludeCorrectable: false
  # Keys are rule-set ids or bare rule ids (detekt does not accept
  # "ruleset>rule" here).
  weights:
    # Complexity is a size metric, not a defect. The IME's input-dispatch and
    # layout-resolution methods are genuinely branchy state machines, and
    # splitting them to satisfy a threshold trades a measurable regression risk
    # for an unmeasurable readability gain. Reported at weight 0: visible in
    # every report, never the reason a build fails.
    complexity: 0
    # Same treatment for documentation drift and TODO tracking — worth seeing,
    # not worth blocking on.
    comments: 0
    ForbiddenComment: 0
    Deprecation: 0
    # Reported but not blocking: for the large, frequently-extended domain enums
    # (KeyAction, ScriptId, ToolbarTool, PanelMode) an `else` branch IS the
    # design — it is the "behaves the ordinary way" case, and spelling out
    # thirty entries per `when` would have to be re-edited for every new
    # language or tool. Left visible so a small closed enum gaining a case
    # still shows up in the report.
    ElseCaseInsteadOfExhaustiveWhen: 0
    # Same: `takeLastWhile`-style parsers and the grapheme walker use several
    # jumps per loop on purpose; the count is not a defect signal here.
    LoopWithTooManyJumpStatements: 0
    # Type-level only. Each hit interpolates a value whose *type* is nullable but
    # which the producer always fills (sizingValuesFor populates every field
    # from the base settings before returning).
    NullableToStringCall: 0
    # Unreliable on this codebase: detekt's K1 frontend does not see parameter
    # uses inside Compose lambdas. Verified false positive — it reports
    # HomeScreen's `onNavigate` as unused where the body calls it 15 times. Left
    # visible because the true positives it does find (dead callback plumbing
    # into KeyboardScreen) were worth deleting; each hit needs confirming by
    # hand before acting on it.
    UnusedParameter: 0

config:
  validation: true
  warningsAsErrors: false
  # Rule-set names that live in plugin jars; without this, config validation
  # rejects the whole file when a plugin is momentarily absent.
  excludes: "$.formatting"

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'

output-reports:
  active: true

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: false
  # Public API here is internal to the app, not a published library; requiring
  # KDoc on all of it would be noise, not documentation.
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  KDocReferencesNonPublicProperty:
    active: true
  OutdatedDocumentation:
    active: true
    matchTypeParameters: true
    matchDeclarationsOrder: false
    allowParamOnConstructorProperties: true

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 5
  ComplexInterface:
    active: false
  CognitiveComplexMethod:
    active: true
    # Deliberately loose: the keyboard's input dispatch and layout resolution are
    # genuinely branchy state machines. Set high enough that only the outliers
    # (which are worth splitting) surface.
    threshold: 60
  CyclomaticComplexMethod:
    active: true
    threshold: 45
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
    ignoreNestingFunctions: true
  LabeledExpression:
    active: false
  LargeClass:
    active: true
    threshold: 1200
  LongMethod:
    active: true
    # Compose UI functions are long by construction (a declarative tree is one
    # expression). This catches the genuinely unreadable ones.
    threshold: 400
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 24
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter:
      - 'Composable'
  MethodOverloading:
    active: false
  NamedArguments:
    active: false
  NestedBlockDepth:
    active: true
    threshold: 7
  NestedScopeFunctions:
    active: true
    threshold: 2
    functions:
      - 'kotlin.apply'
      - 'kotlin.run'
      - 'kotlin.with'
      - 'kotlin.let'
      - 'kotlin.also'
  ReplaceSafeCallChainWithRun:
    # Off: rewriting `a?.b()?.c()` as `a?.run { b().c() }` is a wash for
    # readability and fires 119 times across the Compose panels.
    active: false
  StringLiteralDuplication:
    active: false
  TooManyFunctions:
    active: true
    thresholdInFiles: 60
    thresholdInClasses: 60
    thresholdInInterfaces: 30
    thresholdInObjects: 60
    thresholdInEnums: 30
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
    ignoreAnnotatedFunctions:
      - 'Composable'

coroutines:
  active: true
  GlobalCoroutineUsage:
    # An IME service outliving its own scopes leaks the whole keyboard; every
    # coroutine must belong to a scope with a defined lifetime.
    active: true
  InjectDispatcher:
    active: false
  RedundantSuspendModifier:
    active: true
    # The lite flavour's stubs mirror the full API signature exactly — that is
    # the whole point of them, and it is what keeps the shared callers
    # compiling. `suspend` there is required by the contract, not redundant.
    excludes: ['**/src/lite/**']
  SleepInsteadOfDelay:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  EmptyClassBlock: { active: true }
  EmptyDefaultConstructor: { active: true }
  EmptyDoWhileBlock: { active: true }
  EmptyElseBlock: { active: true }
  EmptyFinallyBlock: { active: true }
  EmptyForBlock: { active: true }
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyIfBlock: { active: true }
  EmptyInitBlock: { active: true }
  EmptyKtFile: { active: true }
  EmptySecondaryConstructor: { active: true }
  EmptyTryBlock: { active: true }
  EmptyWhenBlock: { active: true }
  EmptyWhileBlock: { active: true }

exceptions:
  active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
    methodNames:
      - 'equals'
      - 'finalize'
      - 'hashCode'
      - 'toString'
  InstanceOfCheckForException:
    active: true
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionInMain:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
    exceptions:
      - 'ArrayIndexOutOfBoundsException'
      - 'Exception'
      - 'IllegalArgumentException'
      - 'IllegalMonitorStateException'
      - 'IllegalStateException'
      - 'IndexOutOfBoundsException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
  ThrowingNewInstanceOfSameException:
    active: true
  TooGenericExceptionCaught:
    # An IME that crashes takes the user's text field with it, so broad catches
    # around third-party/ML/native boundaries are a deliberate design choice.
    # TooGenericExceptionThrown (below) stays on — *throwing* Exception is not.
    active: false
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Error'
      - 'Exception'
      - 'RuntimeException'
      - 'Throwable'

naming:
  active: true
  BooleanPropertyNaming:
    # Off: settings booleans are named after the persisted key they back
    # (`floatingKeyboard`, `spacebarSwipes`, ...), and that name is part of the
    # ConfigBackup wire format. Prefixing 600 of them with `is` would rename
    # user-visible config keys to satisfy a naming convention.
    active: false
  ClassNaming: { active: true }
  ConstructorParameterNaming: { active: true }
  EnumNaming: { active: true }
  ForbiddenClassName: { active: false }
  FunctionMaxLength: { active: false }
  FunctionMinLength: { active: false }
  FunctionNaming:
    active: true
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated:
      - 'Composable'
  FunctionParameterNaming: { active: true }
  InvalidPackageDeclaration: { active: true }
  LambdaParameterNaming: { active: true }
  # Off: files here group a feature's declarations (SettingsSearch.kt holds the
  # entry type, the index and the matcher). Renaming each file after whichever
  # declaration happens to be first would describe them less well, not more.
  MatchingDeclarationName:
    active: false
  MemberNameEqualsClassName:
    active: true
    ignoreOverridden: true
  NoNameShadowing:
    # Shadowing is a real source of "why is this the old value" bugs.
    active: true
  # Off: `isWord` is a BooleanArray indexed by trie node — `isWord[node]` reads
  # as the predicate it is. The rule only sees that the property is not a Boolean.
  NonBooleanPropertyPrefixedWithIs: { active: false }
  ObjectPropertyNaming: { active: true }
  PackageNaming: { active: true }
  TopLevelPropertyNaming:
    active: true
    # PascalCase is allowed alongside SCREAMING_SNAKE: it is the Compose
    # convention for constants (`ToolbarMotionMs`, `MaxKeyWidth`) and it is what
    # this codebase uses consistently. Forcing SCREAMING_SNAKE would rename 20
    # constants to match a convention the project deliberately does not follow.
    constantPattern: '[A-Z][_A-Z0-9]*|[A-Z][A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
  VariableMaxLength: { active: false }
  VariableMinLength: { active: false }
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    # Private members holding immutable lookup tables (a Regex, a Set of known
    # tokens) are named as the constants they are. `const val` cannot express
    # them, so SCREAMING_SNAKE is the only signal that they are fixed data.
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'

performance:
  active: true
  ArrayPrimitive:
    active: true
  CouldBeSequence:
    active: true
    threshold: 4
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UnnecessaryPartOfBinaryExpression:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
    forbiddenTypePatterns:
      - 'kotlin.String'
  CastNullableToNonNullableType:
    # Off: all 34 hits are two platform idioms that are documented as
    # non-null — `getSystemService(NAME) as X` for standard system services,
    # and `URL(u).openConnection() as HttpURLConnection` for an http(s) URL.
    # Rewriting them to nullable handling would add error branches that can
    # never run, and would silently disable features where the current code
    # fails loudly. UnsafeCallOnNullableType (below) still covers `!!`.
    active: false
  CastToNullableType:
    active: true
  Deprecation:
    # Reported as info rather than off: deprecations matter, but Android's
    # deprecate-and-replace churn means an IME supporting API 24..36 must keep
    # using some of them behind version checks.
    active: true
    severity: 'info'
  DontDowncastCollectionTypes:
    active: true
  DoubleMutabilityForCollection:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    # An `else` on a `when` over a sealed type / enum silently swallows newly
    # added cases. This project adds enum cases constantly (languages, tools,
    # key actions), so this rule is high value here.
    active: true
    ignoredSubjectTypes:
      - 'kotlin.Int'
      - 'kotlin.String'
      - 'kotlin.Char'
      - 'kotlin.Long'
  EqualsAlwaysReturnsTrueOrFalse: { active: true }
  EqualsWithHashCodeExist: { active: true }
  ExitOutsideMain: { active: true }
  ExplicitGarbageCollectionCall: { active: true }
  HasPlatformType: { active: true }
  IgnoredReturnValue:
    active: true
    restrictToConfig: true
    returnValueAnnotations:
      - '*.CheckResult'
      - '*.CheckReturnValue'
  ImplicitDefaultLocale:
    # `String.format`/`toUpperCase` without a Locale is an outright bug in a
    # 34-language keyboard: Turkish dotless-i is the classic case.
    active: true
  ImplicitUnitReturnType:
    # Off: `fun setX(v: Boolean) = update { it.copy(x = v) }` is the house style
    # for the ~300 settings mutators, and it is unambiguous. The rule is about
    # taste, not about a class of bug.
    active: false
  InvalidRange: { active: true }
  IteratorHasNextCallsNextMethod: { active: true }
  IteratorNotThrowingNoSuchElementException: { active: true }
  LateinitUsage:
    active: false
  MapGetWithNotNullAssertionOperator: { active: true }
  MissingPackageDeclaration: { active: true }
  NullCheckOnMutableProperty:
    # Off: every hit is a plain boolean test (`if (hwJob != null || ...)`) with
    # no dereference afterwards, so there is nothing for a racing writer to
    # invalidate. The case the rule exists for — a null check followed by a use
    # that depends on it — is already a compile error in Kotlin.
    active: false
  NullableToStringCall: { active: true }
  PropertyUsedBeforeDeclaration:
    # Off: the rule flags any *lexical* use before declaration, including uses
    # inside method and lambda bodies, which run long after construction. Every
    # one of the 50 hits in WMKeyboardService was of that shape. Genuine
    # init-order bugs (use from an initializer) are caught by the compiler.
    active: false
  UnconditionalJumpStatementInLoop: { active: true }
  UnnecessaryNotNullCheck: { active: true }
  UnnecessaryNotNullOperator: { active: true }
  UnnecessarySafeCall: { active: true }
  UnreachableCatchBlock: { active: true }
  UnreachableCode: { active: true }
  UnsafeCallOnNullableType: { active: true }
  UnsafeCast: { active: true }
  UnusedUnaryOperator: { active: true }
  WrongEqualsTypeParameter: { active: true }

style:
  active: true
  AlsoCouldBeApply: { active: false }
  BracesOnIfStatements:
    active: false
  BracesOnWhenStatements:
    active: false
  # Off: it fights deliberately-nullable signatures. `lerpColorOrNull(a: Color?,
  # b: Color?)` takes two nullable colours *because* either may be absent; the
  # rule reads the `a ?: b!!` body and concludes the parameters are redundant.
  CanBeNonNullable: { active: false }
  CascadingCallWrapping: { active: false }
  ClassOrdering: { active: false }
  CollapsibleIfStatements: { active: false }
  DataClassContainsFunctions: { active: false }
  DataClassShouldBeImmutable: { active: true }
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 4
  DoubleNegativeLambda: { active: true }
  EqualsNullCall: { active: true }
  EqualsOnSignatureLine: { active: false }
  ExplicitCollectionElementAccessMethod: { active: true }
  ExplicitItLambdaParameter: { active: true }
  ExpressionBodySyntax: { active: false }
  ForbiddenAnnotation:
    active: true
    annotations:
      - reason: 'it is a Java annotation; use `@Suppress` instead'
        value: 'java.lang.SuppressWarnings'
      - reason: 'it is a Java annotation; use `@Deprecated` instead'
        value: 'java.lang.Deprecated'
      - reason: 'it is a Java annotation; use `@Throws` instead'
        value: 'java.lang.annotation.Documented'
  ForbiddenComment:
    # Surfaced, not fatal: an open TODO is information, and this codebase tracks
    # real follow-ups in TODO.md.
    active: true
    severity: 'info'
    comments:
      - reason: 'Forbidden FIXME — fix it or file it.'
        value: 'FIXME:'
      - reason: 'Debug leftover.'
        value: 'STOPSHIP'
  ForbiddenImport:
    active: true
    imports:
      - reason: 'Use kotlinx.coroutines instead of raw threads in new code.'
        value: 'java.util.Timer'
      - reason: 'android.util.Log is the project logger; System.out is dropped on device.'
        value: 'kotlin.io.println'
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'println is invisible on device; use android.util.Log.'
        value: 'kotlin.io.println'
      - reason: 'print is invisible on device; use android.util.Log.'
        value: 'kotlin.io.print'
      - reason: 'Locale-dependent; pass an explicit Locale (Turkish dotless-i).'
        value: 'java.lang.String.format(kotlin.String, kotlin.Array)'
  ForbiddenSuppress: { active: false }
  ForbiddenVoid: { active: true }
  FunctionOnlyReturningConstant:
    active: true
    ignoreOverridableFunction: true
    ignoreActualFunction: true
    # A lite stub returning a constant `false`/`null` is the feature being
    # switched off, not a function that forgot to do something.
    excludes: ['**/src/lite/**']
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 3
  MagicNumber:
    # Off by design. A keyboard is wall-to-wall geometry, Unicode code points and
    # tuned thresholds; naming every one of them would obscure more than it
    # documents, and the rule would fire thousands of times without finding a bug.
    active: false
  MandatoryBracesLoops: { active: false }
  MaxChainedCallsOnSameLine: { active: false }
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
    excludeRawStrings: true
  MayBeConst: { active: true }
  ModifierOrder: { active: true }
  MultilineLambdaItParameter: { active: false }
  MultilineRawStringIndentation: { active: false }
  NestedClassesVisibility: { active: true }
  NewLineAtEndOfFile: { active: true }
  NoTabs: { active: true }
  # Off: the rule rewrites `flag ?: true` as `flag != false`. For settings that
  # default to on when unset, the elvis form says what it means and the
  # comparison form does not.
  NullableBooleanCheck: { active: false }
  ObjectLiteralToLambda: { active: true }
  OptionalAbstractKeyword: { active: true }
  OptionalUnit:
    active: true
    # See RedundantSuspendModifier: the lite and noplay stubs mirror the full
    # and play signatures exactly. An explicit `= Unit` there is the contract
    # the shared callers compile against, not a redundant return type.
    excludes: ['**/src/lite/**', '**/src/noplay/**']
  PreferToOverPairSyntax: { active: false }
  ProtectedMemberInFinalClass: { active: true }
  RedundantExplicitType: { active: true }
  RedundantHigherOrderMapUsage: { active: true }
  RedundantVisibilityModifierRule: { active: false }
  ReturnCount:
    active: true
    # Text classification and key dispatch are decision tables written as early
    # returns; flattening them into one nested expression reads worse and hides
    # the cases.
    max: 12
    excludeGuardClauses: true
  SafeCast: { active: true }
  SerialVersionUIDInSerializableClass: { active: true }
  SpacingBetweenPackageAndImports: { active: true }
  StringShouldBeRawString: { active: false }
  ThrowsCount:
    active: true
    max: 6
    excludeGuardClauses: true
  TrailingWhitespace: { active: true }
  TrimMultilineRawString: { active: true }
  UnderscoresInNumericLiterals: { active: false }
  UnnecessaryAbstractClass: { active: true }
  UnnecessaryAnnotationUseSiteTarget: { active: true }
  UnnecessaryApply: { active: true }
  UnnecessaryBackticks: { active: true }
  UnnecessaryBracesAroundTrailingLambda: { active: true }
  UnnecessaryFilter: { active: true }
  UnnecessaryInheritance: { active: true }
  UnnecessaryInnerClass: { active: true }
  UnnecessaryLet: { active: true }
  UnnecessaryParentheses: { active: false }
  UntilInsteadOfRangeTo: { active: true }
  UnusedImports: { active: true }
  UnusedParameter:
    active: true
    allowedNames: 'ignored|expected|serialVersionUID'
  UnusedPrivateClass: { active: true }
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  UnusedPrivateProperty:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  UseAnyOrNoneInsteadOfFind: { active: true }
  UseArrayLiteralsInAnnotations: { active: true }
  UseCheckNotNull: { active: true }
  UseCheckOrError: { active: true }
  UseRequireNotNull: { active: true }
  UseDataClass: { active: false }
  UseEmptyCounterpart: { active: true }
  UseIfEmptyOrIfBlank: { active: true }
  UseIfInsteadOfWhen: { active: false }
  UseIsNullOrEmpty: { active: true }
  UseLet: { active: true }
  UseOrEmpty: { active: true }
  UseRequire: { active: true }
  UseSumOfInsteadOfFlatMapSize: { active: true }
  UselessCallOnNotNull: { active: true }
  UtilityClassWithPublicConstructor: { active: true }
  VarCouldBeVal:
    active: true
    ignoreLateinitVar: true
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'

# ---------------------------------------------------------------------------
# formatting: the ktlint rule set, shipped by the detekt-formatting plugin.
#
# Whitespace/indentation rules are left OFF: this is a 185k-line existing
# codebase and a mass reformat would bury every real finding in diff noise
# while colliding with in-flight work. What stays ON is the subset of ktlint
# rules that catch *meaning* problems rather than layout — unused imports,
# duplicate imports, name shadowing of `it`, deprecated syntax.
# ---------------------------------------------------------------------------
formatting:
  active: true
  android: true
  autoCorrect: false

  AnnotationOnSeparateLine: { active: false }
  AnnotationSpacing: { active: false }
  ArgumentListWrapping: { active: false }
  BlockCommentInitialStarAlignment: { active: false }
  ChainWrapping: { active: false }
  ClassName: { active: true }
  CommentSpacing: { active: false }
  CommentWrapping: { active: false }
  ContextReceiverMapping: { active: false }
  DiscouragedCommentLocation: { active: false }
  EnumEntryNameCase: { active: true }
  EnumWrapping: { active: false }
  Filename: { active: false }
  FinalNewline: { active: false }
  FunKeywordSpacing: { active: false }
  FunctionName: { active: false }
  FunctionReturnTypeSpacing: { active: false }
  FunctionSignature: { active: false }
  FunctionStartOfBodySpacing: { active: false }
  FunctionTypeReferenceSpacing: { active: false }
  IfElseBracing: { active: false }
  IfElseWrapping: { active: false }
  ImportOrdering: { active: false }
  Indentation: { active: false }
  KdocWrapping: { active: false }
  MaximumLineLength: { active: false }
  ModifierListSpacing: { active: false }
  ModifierOrdering: { active: true }
  MultiLineIfElse: { active: false }
  MultilineExpressionWrapping: { active: false }
  NoBlankLineBeforeRbrace: { active: false }
  NoBlankLineInList: { active: false }
  NoConsecutiveBlankLines: { active: false }
  NoConsecutiveComments: { active: false }
  NoEmptyClassBody: { active: true }
  NoEmptyFile: { active: true }
  NoEmptyFirstLineInClassBody: { active: false }
  NoEmptyFirstLineInMethodBlock: { active: false }
  NoLineBreakAfterElse: { active: false }
  NoLineBreakBeforeAssignment: { active: false }
  NoMultipleSpaces: { active: false }
  NoSemicolons: { active: true }
  NoSingleLineBlockComment: { active: false }
  NoTrailingSpaces: { active: true }
  NoUnitReturn: { active: true }
  # Duplicate of style>UnusedImports, which is the one kept on.
  NoUnusedImports: { active: false }
  NoWildcardImports: { active: true }
  NullableTypeSpacing: { active: false }
  PackageName: { active: true }
  ParameterListSpacing: { active: false }
  ParameterListWrapping: { active: false }
  ParameterWrapping: { active: false }
  PropertyName: { active: false }
  PropertyWrapping: { active: false }
  SpacingAroundAngleBrackets: { active: false }
  SpacingAroundColon: { active: false }
  SpacingAroundComma: { active: false }
  SpacingAroundCurly: { active: false }
  SpacingAroundDot: { active: false }
  SpacingAroundDoubleColon: { active: false }
  SpacingAroundKeyword: { active: false }
  SpacingAroundOperators: { active: false }
  SpacingAroundParens: { active: false }
  SpacingAroundRangeOperator: { active: false }
  SpacingAroundUnaryOperator: { active: false }
  SpacingBetweenDeclarationsWithAnnotations: { active: false }
  SpacingBetweenDeclarationsWithComments: { active: false }
  SpacingBetweenFunctionNameAndOpeningParenthesis: { active: false }
  StringTemplate: { active: true }
  StringTemplateIndent: { active: false }
  TrailingCommaOnCallSite: { active: false }
  TrailingCommaOnDeclarationSite: { active: false }
  TryCatchFinallySpacing: { active: false }
  TypeArgumentListSpacing: { active: false }
