[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
profileinstaller = "1.4.1"
junit = "4.13.2"
# Robolectric runs an Android runtime on the JVM, so a unit test can drive the
# real IME service instead of only its pure helpers. Latest stable.
robolectric = "4.17"
roborazzi = "1.77.0"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
# BiometricPrompt for the settings app's optional fingerprint lock. GMS-free
# and with no native code, so it needs no flavour or channel handling and is
# fine for F-Droid. 1.1.0 is the last stable line; 1.2.0 has been alpha since
# 2021, same rule as luaj and detekt below.
#
# It needs androidx.fragment — which appcompat above already puts on the
# classpath, so nothing new is dragged in. The note on playAppUpdate below is
# not a precedent against this one: there fragment bought a suspend wrapper
# around one Task, here the library's retained BiometricFragment *is* the
# mechanism that carries a prompt across a configuration change.
biometric = "1.1.0"
activityCompose = "1.13.0"
# Compose UI 1.12.1 / Material3 1.4.0. Its aar metadata asks for compileSdk 37,
# which every module compiles against.
composeBom = "2026.09.00"
lifecycle = "2.11.0"
datastore = "1.3.0"
serializationJson = "1.12.0"
coroutines = "1.11.0"
emoji2 = "1.7.0"
autofill = "1.3.0"
navigationCompose = "2.10.2"
# material3-adaptive, for the settings app's two-pane layout on a tablet.
# Keep it on a line whose compose-ui does not exceed the BOM's, or Gradle
# resolves the whole Compose stack up past the BOM.
composeAdaptive = "1.3.0"
mlkitDigitalInk = "19.0.0"
# What digital-ink 19.0.0 and translate 17.0.3 resolve to; named on its own
# because on Play neither of those is in the base APK any more.
mlkitCommon = "18.11.0"
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"
mlkitDynamicFeatureSupport = "16.0.0-beta2"
mlkitTextRecognition = "16.0.1"
mlkitBarcode = "17.3.0"
# Unbundled twins of the two bundled ML Kit artifacts above, used by
# Play-channel builds only (see :feature:ime): Play services downloads the
# models on demand, so ~18 MB per ABI of pipeline .so + model assets stay out
# of the AAB. Sideload/F-Droid channels keep the bundled artifacts so scanners
# work without GMS. The version lines differ because Google numbers the
# unbundled artifacts independently of the bundled ones.
mlkitTextRecognitionUnbundled = "19.0.2"
# The Chinese, Japanese, Korean and Devanagari recognizers (#757), unbundled on
# every channel: Play services fetches each model on first use, and the code
# is about 3 KB each (bundled, they would cost about 4 MB per script per ABI).
mlkitTextRecognitionScriptsUnbundled = "16.0.2"
mlkitBarcodeUnbundled = "18.3.1"
mlkitDocScanner = "16.0.0"
# Unbundled: the model is downloaded from Play services on first use, so
# nothing ships in the APK. Still beta upstream; there is no stable line.
mlkitSubjectSegmentation = "16.0.0-beta1"
camerax = "1.6.2"
# EXIF reading and rewriting for the gallery tool (#708): orientation on
# decode, and the location and camera tags cleared from a photo sent at its
# original size. CameraX already brings it in for :feature:ime; :core:content
# names it itself.
exifinterface = "1.4.2"
coil = "3.6.3"
# Already in the APK as Coil's network engine; declared here so the WebDAV
# backup sink can use it directly. HttpURLConnection cannot: it validates the
# request method against a fixed list and rejects PROPFIND and MOVE outright.
# 5.x resolves to okhttp-android, which brings androidx.startup (already here
# through emoji2 and profileinstaller); Coil's 4.x-built adapter links to it
# unchanged, and ImapSink's OkHostnameVerifier.verify(String, SSLSession) is
# still there. mockwebserver keeps the okhttp3.mockwebserver package.
okhttp = "5.5.1"
# SSH transport for the SFTP backup sink: key exchange, host keys, ciphers.
# The SFTP file protocol on top is our own (sink/sftp), because JSch's
# ChannelSftp builds a java.time formatter in a static initializer and dies
# on Android 7. JSch picks algorithm classes by name, so app/proguard-rules.pro
# keeps exactly the ones SftpAlgorithms turns on and R8 drops the rest.
jsch = "2.28.8"
# Lightweight crypto only, never registered as a JCE provider. JSch uses it for
# the algorithms Android's own providers lack (curve25519, ML-KEM, sntrup761,
# ed25519, chacha20-poly1305), and the SMB sink for MD4, AES-CMAC and AES-CCM.
# Every class is reached by a direct reference, so R8 keeps only those.
# bcpg is its OpenPGP layer, for the Proton Drive sink's keys, names and
# blocks (sink/proton/ProtonPgp.kt), on the same lightweight API.
bouncycastle = "1.86"
# APNG decoding, for animated Signal stickers. Pure Java, Apache-2.0. Its one
# runtime dependency is appcompat, which the app already carries.
apng4android = "3.0.5"
# Compile-only, for :core:content: APNG4Android's drawable implements
# Animatable2Compat, and the compiler has to see a supertype to let the
# drawable be used at all. At run time it arrives with appcompat, at whatever
# version appcompat asks for, which is why this one is never packaged.
vectordrawableAnimated = "1.2.0"
# Draws Telegram's animated stickers (.tgs, gzipped Lottie JSON) frame by
# frame, so they can become animated WebP. Apache-2.0. Its one runtime
# dependency is appcompat, which the app already carries.
lottie = "6.7.1"
zxing = "3.5.4"
litertlm = "0.18.1"
# The NPU runtime behind Compute = NPU (#804), packaged as assets by the
# wmkeyboard.npu-runtime convention, never as dependencies. Dispatch 2.3.2
# accepts the LiteRT API that litertlm 0.18.1 reports (it asks for <= 0.1.0
# and warns on an older one), and litertlm takes any 0.x dispatch API from
# 0.1 on: checked in both binaries' version checks, 2026-10-20, and again
# 2026-10-28 against LITERT_API_VERSION at the LiteRT commit litertlm 0.18.1
# builds from (ca21dc9, still 0.1.0) and at LiteRT v2.3.2 (0.1.0).
litertNpu = "2.3.2"
# Qualcomm's own licence, so full Play and sideload builds only.
qnnRuntime = "2.51.0"
# 2.x splits into litert + litert-api sharing one namespace, which AGP's
# manifest merger rejects; 1.4.2 is the last single-artifact classic runtime
# (org.tensorflow.lite.Interpreter + signature runners).
litert = "1.4.2"
# Microsoft's ONNX Runtime behind Offline Sherpa, never a dependency: its
# libonnxruntime.so is pinned and read out of the AAR on Maven Central
# (wmkeyboard.native-pins), or copied into the APK or :feature:onnx by the
# wmkeyboard.onnxruntime convention. libwmsherpa is built against this
# version's headers (native/sherpa-onnx-jni/build.sh ORT_TAG): keep in step.
onnxruntime = "1.31.1"
# Lua interpreter for the plugin sandbox. Pure JVM, MIT, no transitive deps.
# 3.0.1 is the LAST version published to Maven Central — the 3.0.2 git tag was
# never released as an artifact. Do not bump without re-auditing PluginSandbox:
# it depends on interpreter internals (which exceptions pcall catches, the
# DebugLib.onInstruction hook path, the process-global LuaString.s_metatable)
# that no public API pins down.
luaj = "3.0.1"
# Test only: the ART fold reference in WordKeyParityTest. Robolectric 4.17 pins
# the same version, so it is already in every cache that runs the doc shots.
icu4j = "78.3"
# Play In-App Updates, the only piece of Play Core this app links. It reaches
# the APK *only* when the build is a Play-channel build
# (-Pwmkb.enablePlayStore=true) — see app/build.gradle.kts, which swaps the
# source directory as well as the dependency. 2.1.0 is the current release of
# the split-out app-update artifact; the old monolithic `play:core` is
# deprecated and must not be used. The companion `app-update-ktx` is
# deliberately absent: its whole contribution is a suspend wrapper around one
# Task, and it drags androidx.fragment into an app that has no fragments.
playAppUpdate = "2.1.0"
# SplitInstallManager + SplitCompat for the on-demand AI-runtime module.
# Play-channel builds only, same rule as app-update: a Google Play binary
# that must never reach the F-Droid or direct-download APKs.
playFeatureDelivery = "2.1.0"
# Play's rating card. Play-channel builds only, same rule as app-update, and
# review-ktx is left out for the same reason as app-update-ktx.
playReview = "2.0.2"
playServicesAuth = "22.0.0"
# Play Billing, for the Supporters screen's tips. Play-channel builds only, same
# rule as app-update: Play's Payments policy is why the Play build needs it
# (no SupportKori link allowed there), and F-Droid's scanner is why no other
# build may carry it. billing-ktx is not used; the callbacks are enough.
playBilling = "9.1.0"
# YAML, read-only, for the Espanso importer in :core:content. Espanso match
# files are real YAML — comments, block scalars, quoting rules, the occasional
# anchor — and they come from strangers on the Espanso Hub, so a hand-rolled
# subset parser would be both a bug farm and a security surface.
#
# Only the *loader* is used, always through SafeConstructor with an explicit
# LoaderOptions (code-point, alias and nesting limits). The 1.x default
# constructor instantiated arbitrary classes named in the document, which is
# CVE-2022-1471; 2.x removed that, and this app additionally never goes near
# the unsafe entry points. Writing YAML is hand-rolled in EspansoFile, so the
# emitter half shrinks away and the output keeps its block scalars and comments.
snakeyaml = "2.7"
# Static analysis. detekt 2.x is still alpha; 1.23.8 is the last stable line and
# parses this project's Kotlin fine (no context receivers / `when` guards here).
detekt = "1.23.8"
# Slack's Compose lint checks: Android Lint rules for @Composable correctness
# (unstable parameters, unremembered mutable state, modifier misuse, ...).
composeLints = "1.6.1"
# The baselineprofile Gradle plugin and the macrobenchmark library share a
# version line. 1.5.0 is the first to support AGP 9 with the new DSL: 1.4.x
# wants android.newDsl=false, which this build does not set.
benchmark = "1.5.0"
uiautomator = "2.4.0"
# trace {} and traceAsync {} live in `tracing` itself from 1.3.0; the -ktx
# artifact is an empty shell now. 1.x rather than 2.x: 2.0 adds a Perfetto SDK
# and kotlinx-coroutines-core to the keyboard for an API nothing here uses.
androidxTracing = "1.3.0"
# JankStats. Its AAR asks for compileSdk 35, well under the 36 used here.
metricsPerformance = "1.0.0"
# License audit of every dependency the APK ships; see app/build.gradle.kts.
licensee = "1.14.1"
# Dependency Analysis Gradle Plugin: unused and mis-scoped dependencies, via
# `./gradlew buildHealth`. 3.19.x pulls a Kotlin 2.4 BOM onto the build
# classpath, which the root build.gradle.kts pins back; see the note there.
dependencyAnalysis = "3.19.2"
# Coverage. 0.9.5 is the first release that understands AGP 9.
kover = "0.9.11"
# Architecture rules as tests (:tools:architecture). Latest stable; it bundles
# its own Kotlin parser, which reads this project's sources.
konsist = "0.18.1"
# Flow assertions in tests: every emission accounted for.
turbine = "1.2.1"

