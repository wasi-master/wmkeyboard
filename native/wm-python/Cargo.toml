[package]
name = "wm-python"
version = "0.1.0"
edition = "2021"
publish = false
description = "WM Keyboard's plugin language: a Rust port of PyMini (a small Python interpreter, MIT, anti-ltd/PyMini), its plugin host (wm, ui) and the editor tooling. Used by wm-python-jni (Android), wm-python-wasm (web editor) and wmpy (the plugin CLI and addon repository CI)."
license = "MIT"

[lib]
path = "src/lib.rs"

[build-dependencies]
# Deflates the stdlib modules written in Python (build.rs).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[dependencies]
unicode-segmentation = "1.13"
unicode-normalization = "0.1.26"
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
indexmap = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }
# hashlib and base64 for plugins. Pure Rust, no OS calls.
sha2 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
md5 = { package = "md-5", version = "0.11", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# gzip, zlib and zip entries for plugin file previews. Pure Rust.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# Integers past 64 bits, as Python's are. Pure Rust.
num-bigint = { version = "0.4", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
