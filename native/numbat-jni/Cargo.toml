[package]
name = "numbat-jni"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "wmnumbat"
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false leaves out plotting (plotly) and Numbat's own
# exchange-rate fetching (an HTTP client calling the ECB). Rates come from the
# keyboard's CurrencyClient instead, through nativeSetRates.
numbat = { version = "=1.24.0", default-features = false }
jni = "0.21"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"
